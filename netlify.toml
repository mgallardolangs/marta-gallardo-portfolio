[build]
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "https://www.marttelier.com/*"
  to = "https://marttelier.com/:splat"
  status = 301
  force = true

# Old URLs from before the localized service routes (Nov 2026). Permanent, no chains.
[[redirects]]
  from = "/ugc"
  to = "/servicios/ugc"
  status = 301

[[redirects]]
  from = "/translation-seo"
  to = "/servicios/seo"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contacto"
  status = 301

[[redirects]]
  from = "/en/ugc"
  to = "/en/services/ugc"
  status = 301

[[redirects]]
  from = "/en/translation-seo"
  to = "/en/services/seo"
  status = 301

[[redirects]]
  from = "/fr/ugc"
  to = "/fr/services/ugc"
  status = 301

[[redirects]]
  from = "/fr/translation-seo"
  to = "/fr/services/seo"
  status = 301

[[redirects]]
  from = "/de/ugc"
  to = "/de/dienstleistungen/ugc"
  status = 301

[[redirects]]
  from = "/de/translation-seo"
  to = "/de/dienstleistungen/seo"
  status = 301

[[redirects]]
  from = "/it/ugc"
  to = "/it/servizi/ugc"
  status = 301

[[redirects]]
  from = "/it/translation-seo"
  to = "/it/servizi/seo"
  status = 301

[[redirects]]
  from = "/ca/ugc"
  to = "/ca/serveis/ugc"
  status = 301

[[redirects]]
  from = "/ca/translation-seo"
  to = "/ca/serveis/seo"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.instagram.com https://www.canva.com"
