backend:
  name: git-gateway
  branch: main

# ponytail: Decap CMS config. Marta uses /admin to write blog posts.
# To switch to GitHub auth instead of Netlify Identity, change backend to:
#   name: github
#   repo: berengueradrian/marta-gallardo-portfolio

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "locale_es"
    label: "🌐 Textos del sitio · Español"
    file: "src/i18n/es.json"
    format: "json"
    fields:
      - label: "📌 Navegación"
        name: "nav"
        widget: "object"
        fields:
          - label: "Texto del menú: Inicio"
            name: "home"
            widget: "string"
          - label: "Texto del menú: UGC"
            name: "ugc"
            widget: "string"
          - label: "Texto del menú: Traducción + SEO"
            name: "translationSeo"
            widget: "string"
          - label: "Texto del menú: Blog"
            name: "blog"
            widget: "string"
          - label: "Texto del menú: Contacto"
            name: "contact"
            widget: "string"
      - label: "👤 Perfil / Hero"
        name: "hero"
        widget: "object"
        fields:
          - label: "Nombre visible"
            name: "name"
            widget: "string"
          - label: "Edad o etapa personal"
            name: "age"
            widget: "string"
          - label: "Ciudad o ubicación"
            name: "city"
            widget: "string"
          - label: "Etiqueta profesional: UGC"
            name: "ugcLabel"
            widget: "string"
          - label: "Etiqueta profesional: Traducción + SEO"
            name: "seoLabel"
            widget: "string"
      - label: "📝 Sobre mí"
        name: "about"
        widget: "object"
        fields:
          - label: "Título de la sección"
            name: "title"
            widget: "string"
          - label: "Texto de presentación"
            name: "text"
            widget: "text"
      - label: "🎬 UGC General"
        name: "ugc"
        widget: "object"
        fields:
          - label: "Título de la sección"
            name: "title"
            widget: "string"
          - label: "Subtítulo o frase de apoyo"
            name: "subtitle"
            widget: "string"
          - label: "Nombres de los nichos"
            name: "niches"
            widget: "object"
            fields:
              - label: "Nombre del nicho: Viajes"
                name: "travel"
                widget: "string"
              - label: "Nombre del nicho: Idiomas"
                name: "languages"
                widget: "string"
              - label: "Nombre del nicho: Arte"
                name: "art"
                widget: "string"
          - label: "Texto del botón o CTA"
            name: "cta"
            widget: "string"
      - label: "🌐 Traducción + SEO General"
        name: "translation"
        widget: "object"
        fields:
          - label: "Título de la sección"
            name: "title"
            widget: "string"
          - label: "Etiqueta: Formación"
            name: "education"
            widget: "string"
          - label: "Etiqueta: Experiencia"
            name: "experience"
            widget: "string"
          - label: "Etiqueta: Habilidades"
            name: "skills"
            widget: "string"
          - label: "Etiqueta: Servicios"
            name: "services"
            widget: "string"
          - label: "Etiqueta: Proceso"
            name: "process"
            widget: "string"
          - label: "Pasos del proceso"
            name: "processSteps"
            widget: "object"
            fields:
              - label: "Paso 1: Briefing"
                name: "briefing"
                widget: "string"
              - label: "Paso 2: Traducción / Redacción"
                name: "translation"
                widget: "string"
              - label: "Paso 3: Revisión"
                name: "review"
                widget: "string"
              - label: "Paso 4: Entrega"
                name: "delivery"
                widget: "string"
          - label: "Lista de servicios"
            name: "servicesList"
            widget: "list"
            field:
              label: "Servicio"
              widget: "string"
            min: 4
            max: 4
          - label: "Título del bloque “¿Por qué yo?”"
            name: "whyMe"
            widget: "string"
          - label: "Texto explicativo “¿Por qué yo?”"
            name: "whyMeText"
            widget: "text"
      - label: "📰 Blog"
        name: "blog"
        widget: "object"
        fields:
          - label: "Título del blog"
            name: "title"
            widget: "string"
          - label: "Texto del botón “Leer más”"
            name: "readMore"
            widget: "string"
          - label: "Texto para volver al listado"
            name: "backToList"
            widget: "string"
      - label: "📬 Contacto"
        name: "contact"
        widget: "object"
        fields:
          - label: "Título de la sección"
            name: "title"
            widget: "string"
          - label: "Subtítulo o mensaje introductorio"
            name: "subtitle"
            widget: "text"
          - label: "Formulario UGC"
            name: "ugcForm"
            widget: "object"
            fields:
              - label: "Título del formulario"
                name: "title"
                widget: "string"
              - label: "Etiqueta del campo: Empresa"
                name: "company"
                widget: "string"
              - label: "Etiqueta del campo: Email"
                name: "email"
                widget: "string"
              - label: "Etiqueta del campo: Presupuesto"
                name: "budget"
                widget: "string"
              - label: "Etiqueta del campo: Descripción"
                name: "description"
                widget: "string"
          - label: "Formulario Traducción + SEO"
            name: "seoForm"
            widget: "object"
            fields:
              - label: "Título del formulario"
                name: "title"
                widget: "string"
              - label: "Etiqueta del campo: Empresa"
                name: "company"
                widget: "string"
              - label: "Etiqueta del campo: Email"
                name: "email"
                widget: "string"
              - label: "Etiqueta del campo: Presupuesto"
                name: "budget"
                widget: "string"
              - label: "Etiqueta del campo: Descripción"
                name: "description"
                widget: "string"
          - label: "Texto del botón de envío"
            name: "send"
            widget: "string"
          - label: "Título del mensaje de éxito"
            name: "successTitle"
            widget: "string"
          - label: "Mensaje de confirmación enviado"
            name: "successMessage"
            widget: "text"
      - label: "🦶 Pie de página"
        name: "footer"
        widget: "object"
        fields:
          - label: "Texto legal o derechos reservados"
            name: "rights"
            widget: "string"
      - label: "🌍 Idiomas"
        name: "language"
        widget: "object"
        fields:
          - label: "Etiqueta general del selector"
            name: "label"
            widget: "string"
          - label: "Nombre del idioma: Español"
            name: "es"
            widget: "string"
          - label: "Nombre del idioma: Inglés"
            name: "en"
            widget: "string"
          - label: "Nombre del idioma: Francés"
            name: "fr"
            widget: "string"
          - label: "Nombre del idioma: Alemán"
            name: "de"
            widget: "string"
          - label: "Nombre del idioma: Italiano"
            name: "it"
            widget: "string"
          - label: "Nombre del idioma: Catalán"
            name: "ca"
            widget: "string"
      - label: "🏠 Página principal"
        name: "home"
        widget: "object"
        fields:
          - label: "Hero de la página principal"
            name: "hero"
            widget: "object"
            fields:
              - label: "Antetítulo o kicker"
                name: "kicker"
                widget: "string"
              - label: "Descripción principal"
                name: "description"
                widget: "text"
              - label: "Texto superpuesto sobre la foto principal"
                name: "mainPhoto"
                widget: "string"
              - label: "Texto de ayuda para hacer scroll"
                name: "scrollCue"
                widget: "string"
              - label: "Etiqueta de la portada"
                name: "coverLabel"
                widget: "string"
          - label: "Bloque “Sobre mí” en la home"
            name: "about"
            widget: "object"
            fields:
              - label: "Antetítulo pequeño"
                name: "eyebrow"
                widget: "string"
              - label: "Frase destacada"
                name: "highlight"
                widget: "text"
              - label: "Etiqueta de la lista de idiomas"
                name: "languagesLabel"
                widget: "string"
              - label: "Lista de idiomas mostrados"
                name: "languages"
                widget: "list"
                field:
                  label: "Idioma"
                  widget: "string"
                min: 6
                max: 6
          - label: "Bloque de vídeo"
            name: "video"
            widget: "object"
            fields:
              - label: "Antetítulo del vídeo"
                name: "eyebrow"
                widget: "string"
              - label: "Título del bloque de vídeo"
                name: "title"
                widget: "string"
              - label: "Descripción del bloque de vídeo"
                name: "description"
                widget: "text"
              - label: "Texto del placeholder del vídeo"
                name: "placeholder"
                widget: "string"
              - label: "Nota o formato del vídeo"
                name: "note"
                widget: "string"
          - label: "Textos de la galería"
            name: "gallery"
            widget: "object"
            fields:
              - label: "Texto de la foto 1"
                name: "shotOne"
                widget: "string"
              - label: "Texto de la foto 2"
                name: "shotTwo"
                widget: "string"
              - label: "Texto de la foto 3"
                name: "shotThree"
                widget: "string"
              - label: "Texto de la foto 4"
                name: "shotFour"
                widget: "string"
      - label: "🎬 Página UGC"
        name: "ugcPage"
        widget: "object"
        fields:
          - label: "Hero de la página UGC"
            name: "hero"
            widget: "object"
            fields:
              - label: "Texto de fondo del hero"
                name: "backgroundLabel"
                widget: "string"
              - label: "Antetítulo del hero"
                name: "eyebrow"
                widget: "string"
              - label: "Titular principal"
                name: "headline"
                widget: "string"
              - label: "Descripción principal"
                name: "description"
                widget: "text"
          - label: "Descripción SEO o resumen de la página"
            name: "pageDescription"
            widget: "text"
          - label: "Etiqueta para “Nicho”"
            name: "nicheLabel"
            widget: "string"
          - label: "Texto para volver arriba"
            name: "backToTop"
            widget: "string"
          - label: "Texto del placeholder"
            name: "placeholder"
            widget: "string"
          - label: "Etiqueta “Demo UGC”"
            name: "ugcDemo"
            widget: "string"
          - label: "Etiqueta “Dirección creativa”"
            name: "creativeDirection"
            widget: "string"
          - label: "Etiqueta “Estilo de anuncio nativo”"
            name: "nativeAdStyle"
            widget: "string"
          - label: "Nichos de la página UGC"
            name: "niches"
            widget: "object"
            fields:
              - label: "Nicho: Viajes"
                name: "travel"
                widget: "object"
                fields:
                  - label: "Nombre visible del nicho"
                    name: "label"
                    widget: "string"
                  - label: "Frase destacada o acento"
                    name: "accent"
                    widget: "string"
                  - label: "Antetítulo del nicho"
                    name: "eyebrow"
                    widget: "string"
                  - label: "Introducción del nicho"
                    name: "intro"
                    widget: "text"
                  - label: "Tarjetas del nicho"
                    name: "cards"
                    widget: "list"
                    fields:
                      - label: "Título de la tarjeta"
                        name: "title"
                        widget: "string"
                      - label: "Descripción de la tarjeta"
                        name: "description"
                        widget: "text"
                      - label: "Formato del contenido"
                        name: "format"
                        widget: "string"
                      - label: "Tipo de pieza o soporte"
                        name: "media"
                        widget: "string"
                    min: 4
                    max: 4
                    summary: "{{fields.title}}"
              - label: "Nicho: Idiomas"
                name: "languages"
                widget: "object"
                fields:
                  - label: "Nombre visible del nicho"
                    name: "label"
                    widget: "string"
                  - label: "Frase destacada o acento"
                    name: "accent"
                    widget: "string"
                  - label: "Antetítulo del nicho"
                    name: "eyebrow"
                    widget: "string"
                  - label: "Introducción del nicho"
                    name: "intro"
                    widget: "text"
                  - label: "Tarjetas del nicho"
                    name: "cards"
                    widget: "list"
                    fields:
                      - label: "Título de la tarjeta"
                        name: "title"
                        widget: "string"
                      - label: "Descripción de la tarjeta"
                        name: "description"
                        widget: "text"
                      - label: "Formato del contenido"
                        name: "format"
                        widget: "string"
                      - label: "Tipo de pieza o soporte"
                        name: "media"
                        widget: "string"
                    min: 4
                    max: 4
                    summary: "{{fields.title}}"
              - label: "Nicho: Arte"
                name: "art"
                widget: "object"
                fields:
                  - label: "Nombre visible del nicho"
                    name: "label"
                    widget: "string"
                  - label: "Frase destacada o acento"
                    name: "accent"
                    widget: "string"
                  - label: "Antetítulo del nicho"
                    name: "eyebrow"
                    widget: "string"
                  - label: "Introducción del nicho"
                    name: "intro"
                    widget: "text"
                  - label: "Tarjetas del nicho"
                    name: "cards"
                    widget: "list"
                    fields:
                      - label: "Título de la tarjeta"
                        name: "title"
                        widget: "string"
                      - label: "Descripción de la tarjeta"
                        name: "description"
                        widget: "text"
                      - label: "Formato del contenido"
                        name: "format"
                        widget: "string"
                      - label: "Tipo de pieza o soporte"
                        name: "media"
                        widget: "string"
                    min: 4
                    max: 4
                    summary: "{{fields.title}}"
      - label: "📄 Página Traducción + SEO"
        name: "translationPage"
        widget: "object"
        fields:
          - label: "Copys principales"
            name: "copy"
            widget: "object"
            fields:
              - label: "Antetítulo principal"
                name: "eyebrow"
                widget: "string"
              - label: "Titular principal"
                name: "headline"
                widget: "string"
              - label: "Introducción breve"
                name: "intro"
                widget: "text"
              - label: "Resumen del perfil"
                name: "summary"
                widget: "text"
              - label: "Texto de disponibilidad"
                name: "availability"
                widget: "text"
              - label: "Título del bloque de formación"
                name: "educationTitle"
                widget: "string"
              - label: "Introducción del bloque de formación"
                name: "educationIntro"
                widget: "text"
              - label: "Lista de estudios o hitos formativos"
                name: "studies"
                widget: "list"
                field:
                  label: "Estudio o hito"
                  widget: "string"
                min: 3
                max: 3
              - label: "Título del bloque de idiomas"
                name: "languagesTitle"
                widget: "string"
              - label: "Introducción del bloque de experiencia"
                name: "experienceIntro"
                widget: "text"
              - label: "Experiencias destacadas"
                name: "experience"
                widget: "list"
                fields:
                  - label: "Título de la experiencia"
                    name: "title"
                    widget: "string"
                  - label: "Descripción de la experiencia"
                    name: "text"
                    widget: "text"
                min: 3
                max: 3
                summary: "{{fields.title}}"
              - label: "Introducción del bloque de habilidades"
                name: "skillsIntro"
                widget: "text"
              - label: "Lista de habilidades"
                name: "skills"
                widget: "list"
                field:
                  label: "Habilidad"
                  widget: "string"
                min: 6
                max: 6
              - label: "Lista de herramientas"
                name: "tools"
                widget: "list"
                field:
                  label: "Herramienta"
                  widget: "string"
                min: 4
                max: 4
              - label: "Descripciones del proceso"
                name: "processDescriptions"
                widget: "list"
                field:
                  label: "Descripción del paso"
                  widget: "string"
                min: 4
                max: 4
              - label: "Tarjetas “¿Por qué trabajar conmigo?”"
                name: "whyMeCards"
                widget: "list"
                fields:
                  - label: "Título de la tarjeta"
                    name: "title"
                    widget: "string"
                  - label: "Texto de la tarjeta"
                    name: "text"
                    widget: "text"
                min: 3
                max: 3
                summary: "{{fields.title}}"
              - label: "Título del bloque de muestras"
                name: "samplesTitle"
                widget: "string"
              - label: "Muestras de adaptación"
                name: "samples"
                widget: "list"
                fields:
                  - label: "Etiqueta de la muestra"
                    name: "label"
                    widget: "string"
                  - label: "Etiqueta del texto original"
                    name: "sourceLabel"
                    widget: "string"
                  - label: "Texto original"
                    name: "source"
                    widget: "text"
                  - label: "Etiqueta del texto adaptado"
                    name: "targetLabel"
                    widget: "string"
                  - label: "Texto adaptado"
                    name: "target"
                    widget: "text"
                min: 2
                max: 2
                summary: "{{fields.label}}"
          - label: "Textos de interfaz"
            name: "ui"
            widget: "object"
            fields:
              - label: "Badge: idiomas"
                name: "badgeLanguages"
                widget: "string"
              - label: "Badge: atención al cliente"
                name: "badgeCustomerService"
                widget: "string"
              - label: "Badge: París"
                name: "badgeParis"
                widget: "string"
              - label: "Etiqueta “Perfil profesional”"
                name: "profile"
                widget: "string"
              - label: "Etiqueta “Servicios principales”"
                name: "coreServices"
                widget: "string"
              - label: "Etiqueta “Enfoque”"
                name: "focus"
                widget: "string"
              - label: "Texto del enfoque"
                name: "focusText"
                widget: "text"
              - label: "Título del bloque de idiomas"
                name: "languagesHeading"
                widget: "string"
              - label: "Etiqueta “Experiencia”"
                name: "experienceLabel"
                widget: "string"
              - label: "Etiqueta “Base”"
                name: "core"
                widget: "string"
              - label: "Etiqueta “Editorial”"
                name: "editorial"
                widget: "string"
              - label: "Etiqueta “Herramientas”"
                name: "tools"
                widget: "string"
              - label: "Introducción de servicios"
                name: "servicesIntro"
                widget: "text"
              - label: "Introducción del proceso"
                name: "processIntro"
                widget: "text"
              - label: "Etiqueta “Paso”"
                name: "step"
                widget: "string"
              - label: "Introducción de muestras"
                name: "samplesIntro"
                widget: "text"
          - label: "Niveles de idioma"
            name: "levels"
            widget: "object"
            fields:
              - label: "Nivel: Nativo"
                name: "native"
                widget: "string"
              - label: "Nivel: Avanzado C1"
                name: "advancedC1"
                widget: "string"
              - label: "Nivel: Avanzado"
                name: "advanced"
                widget: "string"
              - label: "Nivel: Intermedio B1"
                name: "intermediateB1"
                widget: "string"
              - label: "Nivel: Básico A2"
                name: "basicA2"
                widget: "string"
